# Production-shaped example. Replace the peer enrollment, endpoint policy,
# model set, and systemd credential name before installation. Secrets are
# never stored in this file.
schema = "ag.config.providerd.v1"
security_profile = "production"
authority_domain = "example-host.production"
epoch = "1"
database = "/var/lib/agent-governor/providerd/providerd.db"
object_store = "/var/lib/agent-governor/providerd/objects"
socket = "/run/agent-governor/providerd/provider.sock"

# Replace these illustrative numeric identities from the live sysusers and
# tmpfiles enrollment before installation.
[store_custody.database_parent]
uid = 990
gid = 990
mode = 0o700

[store_custody.object_store]
uid = 990
gid = 990
mode = 0o700

[store_custody.database]
uid = 990
gid = 990
mode = 0o600

[store_custody.writer_lock]
uid = 990
gid = 990
mode = 0o600

[socket_custody.parent]
uid = 990
gid = 991
mode = 0o2750

[socket_custody.node]
uid = 990
gid = 991
mode = 0o660

[rpc_signing_identity]
principal = "sha256:c111111111111111111111111111111111111111111111111111111111111111"
key_id = "providerd.v1"
public_key = "Wt87MtR1fgf8L7BTeSAEkSps5V8ka2JdFbRxzFC-x6w"
private_key_credential = "/run/credentials/ag-providerd.service/rpc-ed25519-pkcs8"

# The current bootstrap schema accepts one exact caller policy. A future
# worker-direct socket must authenticate each live WorkerSessionPrincipal; it
# must not weaken this entry to a group-only policy.
[caller_peer]
role = "governor_provider_proxy"
uid = 991
gid = 991
executable_identity = "sha256:5111111111111111111111111111111111111111111111111111111111111111"
cgroup_contains = "agd.service"
stable_principal_root = "sha256:6111111111111111111111111111111111111111111111111111111111111111"
principal_kind = "daemon"

[caller_peer.rpc_key]
principal = "sha256:6111111111111111111111111111111111111111111111111111111111111111"
key_id = "agd.v1"
public_key = "ptVL7WK6le_cWbyxf76wk7-gkyAE8dO2_Xt2JfmnfSg"
maximum_clock_skew_ms = 30000

[limits]
max_control_frame_bytes = 94371840
max_concurrent_requests = 16
max_request_bytes = 16777216
max_response_bytes = 67108864
max_rpc_replay_entries = 4096
provider_deadline_ms = 25000

# Endpoint IDs, URLs, models, and protocol adapters are a closed root-owned
# catalog. The credential filename must be supplied by a matching
# LoadCredential= entry in a local ag-providerd.service drop-in.
[[endpoints]]
id = "primary"
url = "https://provider.example.invalid/v1/inference"
credential_name = "provider-api-key"
credential_header = "authorization"
credential_prefix = "Bearer "
protocol = "provider-json-v1"
methods = ["responses.create"]

[[endpoints.models]]
id = "production-model"
max_event_stream_bytes = 8388608
worst_case_cost_microunits = 50000
