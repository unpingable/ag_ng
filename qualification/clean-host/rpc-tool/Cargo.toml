[package]
name = "ag-clean-host-rpc"
description = "Qualification-only AG-ng signed-RPC and enrollment fixture"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
publish = false

# Keep this fixture out of the production workspace.  It is compiled only by
# an explicit --manifest-path invocation and is never selected by debian/rules.
[workspace]

[dependencies]
ag-app = { path = "../../../crates/ag-app" }
ag-effect = { path = "../../../crates/ag-effect" }
ag-primitives = { path = "../../../crates/ag-primitives" }
ag-protocol = { path = "../../../crates/ag-protocol" }
anyhow = "1.0.103"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
libc = "0.2.186"
nix = { version = "0.29.0", features = ["user"] }
ring = "0.17.14"
serde = { version = "1.0.228", features = ["derive"] }
uuid = { version = "1.23.1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
toml = "0.8.23"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
